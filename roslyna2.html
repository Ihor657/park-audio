<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
      margin: 0;
    }

    /* Прихована кнопка для розблокування аудіо */
    #hiddenUnlockBtn {
      position: absolute;
      top: -9999px;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    h2.main-title {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .control-btn {
      background-color: #e0f2e0;
      color: #2e4e2e;
      border: 2px solid #4CAF50;
      padding: 15px;
      font-size: 1.2em;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background-color: #4CAF50;
      color: white;
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 30px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
      justify-content: center;
    }

    .play-btn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c;
    }

    .play-btn.playing:hover {
      background-color: #c0392b;
    }

    .instruction {
      margin-top: 25px;
      font-size: 1.1em;
      font-style: italic;
      color: #555;
      min-height: 1.5em;
    }
  </style>
</head>

<body>

  <!-- Прихована кнопка для автоматичного розблокування звуку -->
  <button id="hiddenUnlockBtn"></button>

  <h2 class="main-title">🌿 Прослухайте опис рослини</h2>

  <div class="controls-container">
    <button class="control-btn" id="startBtn" title="Повернутися на початок">⏮️</button>
    
    <button class="play-btn" id="playBtn">
      <span id="btnIcon">▶️</span>
      <span id="btnText">Відтворити</span>
    </button>
    
    <button class="control-btn" id="endBtn" title="Перейти в кінець">⏭️</button>
  </div>

  <div class="instruction" id="instructionText">
    Завантаження звуку лісу...
  </div>

  <audio id="audio" preload="auto">
    <source src="Audio1.mp3" type="audio/mpeg">
  </audio>

  <audio id="forest" loop preload="auto">
    <source src="Trees.aac" type="audio/aac">
    <source src="Trees.aac" type="audio/mp4">
  </audio>

  <script>
    const hiddenUnlockBtn = document.getElementById('hiddenUnlockBtn');
    const startBtn = document.getElementById('startBtn');
    const playBtn = document.getElementById('playBtn');
    const endBtn = document.getElementById('endBtn');
    
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const instructionText = document.getElementById('instructionText');
    
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlaying = false;
    let audioUnlocked = false;

    forest.volume = 0.35;

    // 1. АВТОМАТИЧНЕ РОЗБЛОКУВАННЯ ЗВУКУ ПРИ ЗАВАНТАЖЕННІ
    window.addEventListener('DOMContentLoaded', () => {
      // Програмно "клікаємо" приховану кнопку для розблокування аудіо
      hiddenUnlockBtn.click();
      
      // Спроба запустити звук лісу
      forest.play().then(() => {
        audioUnlocked = true;
        instructionText.textContent = '🌲 Звук лісу грає. Натисніть кнопку для опису.';
        console.log('✅ Звук лісу автоматично запущено');
      }).catch(err => {
        console.log('⚠️ Автоматичний запуск заблоковано, чекаємо на взаємодію...');
        instructionText.textContent = '🌲 Рухайте мишею або торкніться екрану для активації звуку';
        
        // FALLBACK: Запускаємо при першій взаємодії користувача
        const unlockOnInteraction = () => {
          if (!audioUnlocked) {
            forest.play().then(() => {
              audioUnlocked = true;
              instructionText.textContent = '🌲 Звук лісу грає. Натисніть кнопку для опису.';
              console.log('✅ Звук розблоковано при взаємодії');
            });
          }
        };
        
        document.addEventListener('mousemove', unlockOnInteraction, { once: true });
        document.addEventListener('touchstart', unlockOnInteraction, { once: true });
        document.addEventListener('click', unlockOnInteraction, { once: true });
      });
    });

    // 2. ГОЛОВНА КНОПКА (ПАУЗА / ПРОДОВЖИТИ)
    playBtn.addEventListener('click', () => {
      if (!audioUnlocked) {
        instructionText.textContent = '⚠️ Рухайте мишею або торкніться екрану для активації звуку!';
        return;
      }

      if (!isPlaying) {
        forest.pause();
        audio.play().then(() => {
          isPlaying = true;
          btnIcon.textContent = '⏸️';
          btnText.textContent = 'Пауза';
          playBtn.classList.add('playing');
          instructionText.textContent = '🔊 Йде відтворення опису рослини...';
        }).catch(err => {
          console.error('❌ Помилка відтворення:', err);
          alert('Не вдалося відтворити аудіо');
        });
      } else {
        audio.pause();
        isPlaying = false;
        btnIcon.textContent = '▶️';
        btnText.textContent = 'Продовжити';
        playBtn.classList.remove('playing');
        instructionText.textContent = '⏸️ Аудіо на паузі. Грає фоновий звук лісу.';
        forest.play();
      }
    });

    // 3. КНОПКА "НА ПОЧАТОК"
    startBtn.addEventListener('click', () => {
      if (!audioUnlocked) return;
      
      audio.currentTime = 0;
      audio.play().then(() => {
        isPlaying = true;
        btnIcon.textContent = '⏸️';
        btnText.textContent = 'Пауза';
        playBtn.classList.add('playing');
        forest.pause();
        instructionText.textContent = '🔊 Відтворення з початку...';
      });
    });

    // 4. КНОПКА "В КІНЕЦЬ"
    endBtn.addEventListener('click', () => {
      if (!audioUnlocked) return;
      
      audio.pause();
      isPlaying = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');
      instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      forest.play();
    });

    // 5. КОЛИ МОВА ЗАКІНЧУЄТЬСЯ
    audio.addEventListener('ended', () => {
      isPlaying = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');
      instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      forest.play();
    });
  </script>

</body>
</html>
