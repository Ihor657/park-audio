<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
      margin: 0;
      user-select: none;
    }

    h2.main-title {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 35px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      justify-content: center;
    }

    .play-btn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c;
    }

    .play-btn.playing:hover {
      background-color: #c0392b;
    }

    .progress-container {
      width: 80%;
      max-width: 400px;
      margin: 25px auto 10px auto;
      display: flex;
      align-items: center;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: #c8e6c9;
      outline: none;
      cursor: pointer;
      transition: background 0.15s ease-in-out;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4CAF50;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }

    .seek-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .seek-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: #4CAF50;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .time-display {
      margin-top: 10px;
      font-size: 1.3em;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      padding: 12px 25px;
      border-radius: 25px;
      display: inline-block;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      min-width: 180px;
    }

    .time-display span {
      color: #ffff99;
      font-family: 'Courier New', monospace;
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
      color: #555;
      min-height: 1.5em;
    }

    @media (max-width: 768px) {
      body { padding: 40px 15px; }
      h2.main-title { font-size: 1.5em; margin-bottom: 10px; }
      .play-btn { padding: 15px 25px; font-size: 1.1em; min-width: 180px; gap: 8px; }
      .time-display { font-size: 1.1em; padding: 10px 20px; min-width: 150px; margin-top: 15px; }
      .instruction { margin-top: 20px; font-size: 0.95em; }
      .progress-container { width: 90%; }
    }

    @media (max-width: 480px) {
      body { padding: 30px 10px; }
      h2.main-title { font-size: 1.3em; }
      .play-btn { padding: 12px 20px; font-size: 1em; min-width: 160px; gap: 6px; }
      .time-display { font-size: 1em; padding: 8px 15px; min-width: 140px; margin-top: 12px; }
      .instruction { font-size: 0.85em; margin-top: 15px; }
      .progress-container { width: 95%; }
    }
  </style>
</head>

<body>

  <h2 class="main-title">🌿 Прослухайте опис рослини</h2>

  <div class="controls-container">
    <button class="play-btn" id="playBtn">
      <span id="btnIcon">▶️</span>
      <span id="btnText">Відтворити</span>
    </button>
  </div>

  <div class="progress-container">
    <input type="range" id="seekBar" class="seek-slider" value="0" min="0" max="100" step="0.1">
  </div>

  <div class="time-display" id="timeDisplay">
    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
  </div>

  <div class="instruction" id="instructionText">
    🌲 Торкніться екрана для запуску аудіо
  </div>

  <audio id="audio" preload="metadata">
    <source src="Audio1.mp3" type="audio/mpeg">
  </audio>

  <audio id="forest" loop preload="metadata">
    <source src="Trees.aac" type="audio/aac">
    <source src="Trees.aac" type="audio/mp4">
  </audio>

  <script>
    const playBtn = document.getElementById('playBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const instructionText = document.getElementById('instructionText');
    
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlayingDescription = false;
    let isForestPlaying = false;
    let audioUnlocked = false;
    let isSeeking = false;
    let userPausedForest = false; // Прапорець: чи поставив користувач ліс на паузу вручну

    forest.volume = 0.35;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Оновлення прогресу
    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && audio.duration) {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const progressPercentage = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progressPercentage;
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    // Управління повзунком
    seekBar.addEventListener('input', (e) => {
      e.stopPropagation();
      isSeeking = true;
      if (audio.duration) {
        const seekTime = (seekBar.value / 100) * audio.duration;
        currentTimeEl.textContent = formatTime(seekTime);
      }
    });

    seekBar.addEventListener('change', (e) => {
      e.stopPropagation();
      if (!audioUnlocked) {
        audioUnlocked = true;
      }
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
      isSeeking = false;
    });

    seekBar.addEventListener('click', (e) => e.stopPropagation());
    seekBar.addEventListener('touchstart', (e) => e.stopPropagation());

    // Керування лісом
    function playForestSound() {
      forest.play().then(() => {
        isForestPlaying = true;
      }).catch(err => console.log('Помилка відтворення лісу:', err));
    }

    function pauseForestSound() {
      forest.pause();
      isForestPlaying = false;
    }

    // Керування кнопкою «Відтворити»
    function togglePlayback() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Натисніть "Відтворити" для опису.';
        return;
      }

      if (!isPlayingDescription) {
        pauseForestSound(); // Під час опису ліс завжди мовчить
        audio.play().then(() => {
          isPlayingDescription = true;
          btnIcon.textContent = '⏸️';
          btnText.textContent = 'Пауза';
          playBtn.classList.add('playing');
          instructionText.textContent = '🔊 Йде відтворення опису рослини...';
        }).catch(err => console.error('Помилка відтворення:', err));
      } else {
        audio.pause();
        isPlayingDescription = false;
        btnIcon.textContent = '▶️';
        btnText.textContent = 'Продовжити';
        playBtn.classList.remove('playing');

        // Вмикаємо ліс, ТІЛЬКИ якщо користувач НЕ ставив його на паузу вручну
        if (!userPausedForest) {
          playForestSound();
          instructionText.textContent = '⏸️ Опис на паузі. Грає фоновий звук лісу.';
        } else {
          instructionText.textContent = '⏸️ Звук повністю на паузі. Торкніться екрана для відновлення.';
        }
      }
    }

    // Дотик до порожнього екрана
    function handleScreenTouch(e) {
      if (e.target.closest('button') || e.target.closest('#seekBar')) return;

      if (!audioUnlocked) {
        audioUnlocked = true;
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Натисніть "Відтворити" для опису.';
        return;
      }

      // Якщо зараз грає опис — ставимо його на паузу
      if (isPlayingDescription) {
        togglePlayback();
      } 
      // Якщо грає звук лісу — зупиняємо його і запам'ятовуємо вибір користувача
      else if (isForestPlaying) {
        pauseForestSound();
        userPausedForest = true;
        instructionText.textContent = '⏸️ Всі звуки на паузі. Торкніться екрана для відновлення.';
      } 
      // Якщо нічого не грає — відновлюємо звук лісу
      else {
        userPausedForest = false;
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Натисніть "Відтворити" для опису.';
      }
    }

    document.body.addEventListener('click', handleScreenTouch);

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayback();
    });

    // Завершення аудіо опису
    audio.addEventListener('ended', () => {
      isPlayingDescription = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');

      if (!userPausedForest) {
        playForestSound();
        instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      } else {
        instructionText.textContent = '✅ Відтворення завершено.';
      }
    });
  </script>

</body>
</html>
