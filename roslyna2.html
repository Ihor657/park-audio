<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c; /* червона, коли грає */
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
    }
  </style>
</head>

<body>

  <h2>🌿 Прослухайте опис рослини</h2>

  <button class="play-btn" id="playBtn">
    ▶️ Відтворити
  </button>

  <div class="instruction">
    Натисніть кнопку, щоб почати аудіо
  </div>

  <!-- Основне аудіо (мова) -->
  <audio id="audio">
    <source src="Audio1.mp3" type="audio/mpeg">
    Ваш браузер не підтримує аудіо.
  </audio>

  <!-- Фоновий звук лісу -->
  <audio id="forest" loop preload="auto">
    <source src="Trees.aac" type="audio/aac">
  </audio>

  <script>
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlaying = false;

    // Гучність фону
    forest.volume = 0.35;

    // Запускаємо звук лісу одразу при відкритті сторінки
    function startForest() {
      forest.play().catch(() => {
        // Якщо браузер заблокував — спробуємо ще раз при першій взаємодії
        document.body.addEventListener('click', () => {
          if (forest.paused && !isPlaying) {
            forest.play().catch(() => {});
          }
        }, { once: true });
      });
    }

    startForest();

    // Обробка кнопки
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        // === ПОЧАТИ МОВУ ===
        forest.pause();           // зупиняємо ліс
        forest.currentTime = 0;

        audio.currentTime = 0;
        audio.play();

        playBtn.innerHTML = '⏹️ Зупинити';
        playBtn.classList.add('playing');
        isPlaying = true;

      } else {
        // === ЗУПИНИТИ МОВУ ===
        audio.pause();
        audio.currentTime = 0;

        // Повертаємо звук лісу
        forest.play().catch(() => {});

        playBtn.innerHTML = '▶️ Відтворити';
        playBtn.classList.remove('playing');
        isPlaying = false;
      }
    });

    // Коли мова закінчилася — автоматично повертаємо кнопку і ліс
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '▶️ Відтворити';
      playBtn.classList.remove('playing');
      isPlaying = false;
      forest.play().catch(() => {});
    });
  </script>

</body>
</html>
