<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c;
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
    }
  </style>
</head>

<body>

  <h2>🌿 Прослухайте опис рослини</h2>

  <button class="play-btn" id="playBtn">
    ▶️ Відтворити
  </button>

  <div class="instruction">
    Натисніть кнопку, щоб почати аудіо
  </div>

  <!-- Основне аудіо (мова) -->
  <audio id="audio" preload="auto">
    <source src="Audio1.mp3" type="audio/mpeg">
  </audio>

  <!-- Фоновий звук лісу -->
  <audio id="forest" loop preload="auto">
    <source src="Trees.aac" type="audio/aac">
    <source src="Trees.aac" type="audio/mp4">
  </audio>

  <script>
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlaying = false;
    let forestStarted = false;

    forest.volume = 0.35;

    // Функція запуску лісу
    function startForest() {
      if (forestStarted) return;
      forest.play()
        .then(() => {
          forestStarted = true;
          console.log('Ліс грає');
        })
        .catch(err => {
          console.log('Автовідтворення заблоковано:', err);
        });
    }

    // Спроба запустити ліс одразу
    startForest();

    // Якщо браузер заблокував — запускаємо при будь-якій взаємодії
    document.body.addEventListener('click', () => {
      if (!forestStarted && !isPlaying) {
        startForest();
      }
    }, { once: true });

    // Також при дотику (для телефонів)
    document.body.addEventListener('touchstart', () => {
      if (!forestStarted && !isPlaying) {
        startForest();
      }
    }, { once: true });

    // Кнопка
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        // Зупиняємо ліс і запускаємо мову
        forest.pause();
        forest.currentTime = 0;

        audio.currentTime = 0;
        audio.play().catch(err => {
          console.error('Помилка мови:', err);
          alert('Не вдалося відтворити аудіо');
        });

        playBtn.innerHTML = '⏹️ Зупинити';
        playBtn.classList.add('playing');
        isPlaying = true;

      } else {
        // Зупиняємо мову і повертаємо ліс
        audio.pause();
        audio.currentTime = 0;

        startForest();

        playBtn.innerHTML = '▶️ Відтворити';
        playBtn.classList.remove('playing');
        isPlaying = false;
      }
    });

    // Коли мова закінчилася
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '▶️ Відтворити';
      playBtn.classList.remove('playing');
      isPlaying = false;
      startForest();
    });
  </script>

</body>
</html>
