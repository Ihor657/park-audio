<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
      margin: 0;
    }

    #hiddenUnlockBtn {
      position: absolute;
      top: -9999px;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    h2.main-title {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .control-btn {
      background-color: #e0f2e0;
      color: #2e4e2e;
      border: 2px solid #4CAF50;
      padding: 15px;
      font-size: 1.2em;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background-color: #4CAF50;
      color: white;
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 30px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
      justify-content: center;
    }

    .play-btn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c;
    }

    .play-btn.playing:hover {
      background-color: #c0392b;
    }

    /* Відображення часу */
    .time-display {
      margin-top: 15px;
      font-size: 1.1em;
      font-weight: 600;
      color: #2e4e2e;
      background-color: #e0f2e0;
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      min-width: 150px;
    }

    .time-display span {
      color: #4CAF50;
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
      color: #555;
      min-height: 1.5em;
    }

    /* АДАПТИВНІСТЬ ДЛЯ ТЕЛЕФОНІВ */
    @media (max-width: 768px) {
      body {
        padding: 40px 15px;
      }

      h2.main-title {
        font-size: 1.5em;
        margin-bottom: 10px;
      }

      .controls-container {
        gap: 10px;
        margin-top: 15px;
      }

      .control-btn {
        width: 50px;
        height: 50px;
        font-size: 1em;
        padding: 12px;
      }

      .play-btn {
        padding: 15px 20px;
        font-size: 1.1em;
        min-width: 160px;
        gap: 8px;
      }

      .time-display {
        font-size: 0.95em;
        padding: 6px 15px;
        min-width: 130px;
        margin-top: 12px;
      }

      .instruction {
        margin-top: 20px;
        font-size: 0.95em;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 30px 10px;
      }

      h2.main-title {
        font-size: 1.3em;
      }

      .controls-container {
        gap: 8px;
      }

      .control-btn {
        width: 45px;
        height: 45px;
        font-size: 0.9em;
        padding: 10px;
      }

      .play-btn {
        padding: 12px 15px;
        font-size: 1em;
        min-width: 140px;
        gap: 6px;
      }

      .time-display {
        font-size: 0.85em;
        padding: 5px 12px;
        min-width: 120px;
        margin-top: 10px;
      }

      .instruction {
        font-size: 0.85em;
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <button id="hiddenUnlockBtn"></button>

  <h2 class="main-title"> Прослухайте опис рослини</h2>

  <div class="controls-container">
    <button class="control-btn" id="startBtn" title="Повернутися на початок">⏮️</button>
    
    <button class="play-btn" id="playBtn">
      <span id="btnIcon">▶️</span>
      <span id="btnText">Відтворити</span>
    </button>
    
    <button class="control-btn" id="endBtn" title="Перейти в кінець">️</button>
  </div>

  <!-- Відображення часу -->
  <div class="time-display" id="timeDisplay">
    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
  </div>

  <div class="instruction" id="instructionText">
    Завантаження звуку лісу...
  </div>

  <audio id="audio" preload="auto">
    <source src="Audio1.mp3" type="audio/mpeg">
  </audio>

  <audio id="forest" loop preload="auto">
    <source src="Trees.aac" type="audio/aac">
    <source src="Trees.aac" type="audio/mp4">
  </audio>

  <script>
    const hiddenUnlockBtn = document.getElementById('hiddenUnlockBtn');
    const startBtn = document.getElementById('startBtn');
    const playBtn = document.getElementById('playBtn');
    const endBtn = document.getElementById('endBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const instructionText = document.getElementById('instructionText');
    
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlaying = false;
    let audioUnlocked = false;

    forest.volume = 0.35;

    // Функція форматування часу (секунди -> ММ:СС)
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Оновлення часу відтворення
    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    // Отримання загальної тривалості аудіо
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    // Скидання часу коли аудіо закінчується
    audio.addEventListener('ended', () => {
      currentTimeEl.textContent = formatTime(audio.duration);
    });

    window.addEventListener('DOMContentLoaded', () => {
      hiddenUnlockBtn.click();
      
      forest.play().then(() => {
        audioUnlocked = true;
        instructionText.textContent = '🌲 Звук лісу грає. Натисніть кнопку для опису.';
        console.log('✅ Звук лісу автоматично запущено');
      }).catch(err => {
        console.log('⚠️ Автоматичний запуск заблоковано, чекаємо на взаємодію...');
        instructionText.textContent = '🌲 Рухайте мишею або торкніться екрану для активації звуку';
        
        const unlockOnInteraction = () => {
          if (!audioUnlocked) {
            forest.play().then(() => {
              audioUnlocked = true;
              instructionText.textContent = '🌲 Звук лісу грає. Натисніть кнопку для опису.';
              console.log('✅ Звук розблоковано при взаємодії');
            });
          }
        };
        
        document.addEventListener('mousemove', unlockOnInteraction, { once: true });
        document.addEventListener('touchstart', unlockOnInteraction, { once: true });
        document.addEventListener('click', unlockOnInteraction, { once: true });
      });
    });

    playBtn.addEventListener('click', () => {
      if (!audioUnlocked) {
        instructionText.textContent = '⚠️ Рухайте мишею або торкніться екрану для активації звуку!';
        return;
      }

      if (!isPlaying) {
        forest.pause();
        audio.play().then(() => {
          isPlaying = true;
          btnIcon.textContent = '️';
          btnText.textContent = 'Пауза';
          playBtn.classList.add('playing');
          instructionText.textContent = '🔊 Йде відтворення опису рослини...';
        }).catch(err => {
          console.error('❌ Помилка відтворення:', err);
          alert('Не вдалося відтворити аудіо');
        });
      } else {
        audio.pause();
        isPlaying = false;
        btnIcon.textContent = '▶️';
        btnText.textContent = 'Продовжити';
        playBtn.classList.remove('playing');
        instructionText.textContent = '️ Аудіо на паузі. Грає фоновий звук лісу.';
        forest.play();
      }
    });

    startBtn.addEventListener('click', () => {
      if (!audioUnlocked) return;
      
      audio.currentTime = 0;
      audio.play().then(() => {
        isPlaying = true;
        btnIcon.textContent = '⏸️';
        btnText.textContent = 'Пауза';
        playBtn.classList.add('playing');
        forest.pause();
        instructionText.textContent = '🔊 Відтворення з початку...';
      });
    });

    endBtn.addEventListener('click', () => {
      if (!audioUnlocked) return;
      
      audio.pause();
      isPlaying = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');
      instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      forest.play();
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');
      instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      forest.play();
    });
  </script>

</body>
</html>
