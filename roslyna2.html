<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
      margin: 0;
      user-select: none;
    }

    h2.main-title {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .control-btn {
      background-color: #e0f2e0;
      color: #2e4e2e;
      border: 2px solid #4CAF50;
      padding: 15px;
      font-size: 1.2em;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background-color: #4CAF50;
      color: white;
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 30px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
      justify-content: center;
    }

    .play-btn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .play-btn.playing {
      background-color: #e74c3c;
    }

    .play-btn.playing:hover {
      background-color: #c0392b;
    }

    .time-display {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      padding: 12px 25px;
      border-radius: 25px;
      display: inline-block;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      min-width: 180px;
    }

    .time-display span {
      color: #ffff99;
      font-family: 'Courier New', monospace;
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
      color: #555;
      min-height: 1.5em;
    }

    @media (max-width: 768px) {
      body { padding: 40px 15px; }
      h2.main-title { font-size: 1.5em; margin-bottom: 10px; }
      .controls-container { gap: 10px; margin-top: 15px; }
      .control-btn { width: 50px; height: 50px; font-size: 1em; padding: 12px; }
      .play-btn { padding: 15px 20px; font-size: 1.1em; min-width: 160px; gap: 8px; }
      .time-display { font-size: 1.1em; padding: 10px 20px; min-width: 150px; margin-top: 15px; }
      .instruction { margin-top: 20px; font-size: 0.95em; }
    }

    @media (max-width: 480px) {
      body { padding: 30px 10px; }
      h2.main-title { font-size: 1.3em; }
      .controls-container { gap: 8px; }
      .control-btn { width: 45px; height: 45px; font-size: 0.9em; padding: 10px; }
      .play-btn { padding: 12px 15px; font-size: 1em; min-width: 140px; gap: 6px; }
      .time-display { font-size: 1em; padding: 8px 15px; min-width: 140px; margin-top: 12px; }
      .instruction { font-size: 0.85em; margin-top: 15px; }
    }
  </style>
</head>

<body>

  <h2 class="main-title">🌿 Прослухайте опис рослини</h2>

  <div class="controls-container">
    <button class="control-btn" id="startBtn" title="Назад на 30 сек">⏮️</button>
    
    <button class="play-btn" id="playBtn">
      <span id="btnIcon">▶️</span>
      <span id="btnText">Відтворити</span>
    </button>
    
    <button class="control-btn" id="endBtn" title="Вперед на 30 сек">⏭️</button>
  </div>

  <div class="time-display" id="timeDisplay">
    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
  </div>

  <div class="instruction" id="instructionText">
    🌲 Торкніться екрана для запуску аудіо
  </div>

  <audio id="audio" preload="metadata">
    <source src="Audio1.mp3" type="audio/mpeg">
  </audio>

  <audio id="forest" loop preload="metadata">
    <source src="Trees.aac" type="audio/aac">
    <source src="Trees.aac" type="audio/mp4">
  </audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const playBtn = document.getElementById('playBtn');
    const endBtn = document.getElementById('endBtn');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const instructionText = document.getElementById('instructionText');
    
    const audio = document.getElementById('audio');
    const forest = document.getElementById('forest');

    let isPlayingDescription = false;
    let isForestPlaying = false;
    let audioUnlocked = false;

    forest.volume = 0.35;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    // Управління фоном лісу
    function playForestSound() {
      forest.play().then(() => {
        isForestPlaying = true;
      }).catch(err => console.log('Не вдалося запустити ліс:', err));
    }

    function pauseForestSound() {
      forest.pause();
      isForestPlaying = false;
    }

    // Загальний перемикач відтворення опису
    function togglePlayback() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Натисніть "Відтворити" для опису.';
        return;
      }

      if (!isPlayingDescription) {
        pauseForestSound();
        audio.play().then(() => {
          isPlayingDescription = true;
          btnIcon.textContent = '⏸️';
          btnText.textContent = 'Пауза';
          playBtn.classList.add('playing');
          instructionText.textContent = '🔊 Йде відтворення опису рослини...';
        }).catch(err => console.error('Помилка відтворення:', err));
      } else {
        audio.pause();
        isPlayingDescription = false;
        btnIcon.textContent = '▶️';
        btnText.textContent = 'Продовжити';
        playBtn.classList.remove('playing');
        instructionText.textContent = '⏸️ Аудіо на паузі. Грає фоновий звук лісу.';
        playForestSound();
      }
    }

    // Пауза/Старт всього аудіо при доторку до порожнього екрана
    function handleScreenTouch(e) {
      if (e.target.closest('button')) return;

      if (!audioUnlocked) {
        audioUnlocked = true;
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Торкніться кнопкою для опису.';
        return;
      }

      // Якщо зараз грає опис — ставимо його на паузу
      if (isPlayingDescription) {
        togglePlayback();
      } 
      // Якщо грає звук лісу — ставимо його на паузу
      else if (isForestPlaying) {
        pauseForestSound();
        instructionText.textContent = '⏸️ Звук на паузі. Торкніться екрана для продовження.';
      } 
      // Якщо взагалі нічого не грає — відновлюємо звук лісу
      else {
        playForestSound();
        instructionText.textContent = '🌲 Фоновий звук грає. Натисніть "Відтворити" для опису.';
      }
    }

    document.body.addEventListener('click', handleScreenTouch);

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayback();
    });

    // Перемотка на 30 секунд назад
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!audioUnlocked) return;
      
      audio.currentTime = Math.max(0, audio.currentTime - 30);
      currentTimeEl.textContent = formatTime(audio.currentTime);
      instructionText.textContent = '⏪ Перемотано на 30 секунд назад';
    });

    // Перемотка на 30 секунд вперед
    endBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!audioUnlocked) return;
      
      if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 30);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        instructionText.textContent = '⏩ Перемотано на 30 секунд вперед';
      }
    });

    // Завершення аудіо опису
    audio.addEventListener('ended', () => {
      isPlayingDescription = false;
      btnIcon.textContent = '▶️';
      btnText.textContent = 'Відтворити';
      playBtn.classList.remove('playing');
      instructionText.textContent = '✅ Відтворення завершено. Грає фоновий звук лісу.';
      playForestSound();
    });
  </script>

</body>
</html>
