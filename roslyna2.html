<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опис рослини</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2fff2;
      text-align: center;
      padding: 60px 20px;
      color: #2e4e2e;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .play-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .instruction {
      margin-top: 20px;
      font-size: 1.1em;
      font-style: italic;
    }
  </style>
</head>

<body>

  <h2>🌿 Прослухайте опис рослини</h2>

  <button class="play-btn" onclick="playAll()">
    ▶️ Відтворити
  </button>

  <div class="instruction">
    Натисніть кнопку, щоб почати аудіо
  </div>

  <!-- Основне аудіо -->
  <audio id="audio">
    <source src="Audio1.mp3" type="audio/mpeg">
    Ваш браузер не підтримує аудіо.
  </audio>

  <!-- Фоновий звук лісу -->
  <audio id="forest" loop>
    <source src="Trees.aac" type="audio/aac">
  </audio>

  <script>
    const forest = document.getElementById('forest');
    forest.volume = 0.3; // гучність фону (можна змінити)

    // Функція, яка запускає і опис, і фон
    function playAll() {
      // Запускаємо фон лісу
      forest.play().catch(e => console.log('Фон не запустився:', e));

      // Запускаємо опис рослини
      document.getElementById('audio').play();
    }

    // Спроба запустити фон одразу при відкритті сторінки
    window.addEventListener('load', () => {
      forest.play().catch(() => {
        // Браузер заборонив автовідтворення — фон запуститься при натисканні кнопки
      });
    });
  </script>

</body>
</html>
